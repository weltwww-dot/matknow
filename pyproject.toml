[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matknow"
version = "0.10.18"
description = "Native desktop research knowledge assistant with isolated profiles and custom models"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "pypdf==6.20.1",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "httpx2>=2.13"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
matknow = "matknow.__main__:main"

[tool.setuptools.packages.find]
include = ["matknow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"
